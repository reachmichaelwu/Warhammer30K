<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horus Heresy 3rd Edition — Combat Toolkit</title>
  <meta name="description" content="Army builder, shooting resolver, assault phase, charge phase, and challenge resolver for Warhammer: The Horus Heresy Age of Darkness (3rd Edition)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="warroom-game.css?v=warroom-game-2">
  <link rel="stylesheet" href="mobile.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050f05">
  <style>
    #loading-screen {
      position: fixed; inset: 0; z-index: 100000;
      background: #050f05;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      color: #00ff41;
      transition: opacity 0.5s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .ld-logotype {
      font-family: 'VT323', 'Share Tech Mono', monospace;
      font-size: 52px; letter-spacing: 8px;
      color: #00ff41;
      text-shadow: 0 0 12px #00ff41, 0 0 30px rgba(0,255,65,0.3);
      animation: ld-pulse 1.5s ease-in-out infinite;
      line-height: 1;
    }
    .ld-subtitle {
      font-size: 13px; letter-spacing: 4px;
      color: #ccaa00; margin-top: 6px;
      text-shadow: 0 0 8px #ccaa00;
    }
    .ld-bar-outer {
      width: 320px; height: 14px; margin-top: 28px;
      border: 1px solid #00aa2a; background: #020802; overflow: hidden;
    }
    .ld-bar-inner {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #004d15, #00ff41);
      box-shadow: 0 0 10px #00ff41; transition: width 0.15s ease;
    }
    .ld-status {
      margin-top: 10px; font-size: 11px;
      color: #00aa2a; letter-spacing: 2px; text-transform: uppercase;
    }
    .ld-status::before { content: "→ "; color: #00cc33; }
    #ld-error {
      margin-top: 16px; font-size: 12px; color: #cc2222;
      text-shadow: 0 0 8px #cc2222; max-width: 500px; text-align: center;
      display: none;
    }
    @keyframes ld-pulse {
      0%,100% { text-shadow: 0 0 8px #00ff41, 0 0 20px rgba(0,255,65,0.2); }
      50%     { text-shadow: 0 0 16px #00ff41, 0 0 40px rgba(0,255,65,0.5); }
    }
  </style>
</head>
<body>
  <!-- Mobile / iOS-frame detection — runs BEFORE the app so body classes
       are already set when CSS resolves and React mounts. -->
  <script src="18-mobile-detect.js?v=warroom-game-2"></script>

  <!-- iOS chrome (status bar + home indicator). These are CSS-hidden unless
       body.hh-show-frame is active. -->
  <div class="hh-ios-statusbar" aria-hidden="true">
    <span class="hh-clock">9:41</span>
    <span class="hh-icons">
      <svg width="18" height="11" viewBox="0 0 18 11" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="6" width="3" height="4" rx="0.5" fill="currentColor"/>
        <rect x="5" y="4" width="3" height="6" rx="0.5" fill="currentColor"/>
        <rect x="9" y="2" width="3" height="8" rx="0.5" fill="currentColor"/>
        <rect x="13" y="0" width="3" height="10" rx="0.5" fill="currentColor"/>
      </svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 2.5C10.2 2.5 12.3 3.4 13.9 4.9L15 3.7C13.1 1.9 10.6 0.9 8 0.9C5.4 0.9 2.9 1.9 1 3.7L2.1 4.9C3.7 3.4 5.8 2.5 8 2.5Z" fill="currentColor"/>
        <path d="M8 5.6C9.5 5.6 10.9 6.2 11.9 7.2L13 6.1C11.7 4.7 9.9 4 8 4C6.1 4 4.3 4.7 3 6.1L4.1 7.2C5.1 6.2 6.5 5.6 8 5.6Z" fill="currentColor"/>
        <circle cx="8" cy="9.2" r="1.5" fill="currentColor"/>
      </svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="currentColor" fill="none"/>
        <rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/>
        <rect x="23" y="4" width="2" height="4" rx="0.5" fill="currentColor"/>
      </svg>
    </span>
  </div>
  <div class="hh-home-indicator" aria-hidden="true"></div>

  <!-- Live clock for the iOS status bar (no-op when hidden) -->
  <script>
    (function () {
      var el = document.querySelector(".hh-ios-statusbar .hh-clock");
      if (!el) return;
      function tick() {
        var d = new Date();
        var h = d.getHours();
        var m = d.getMinutes();
        el.textContent = h + ":" + (m < 10 ? "0" + m : m);
      }
      tick();
      setInterval(tick, 30000);
    })();
  </script>

  <div id="loading-screen">
    <div class="ld-logotype">&#x2E22; HORUS HERESY &#x2E25;</div>
    <div class="ld-subtitle">&#x2014; TOOLKIT &middot; M31 &#x2014;</div>
    <div class="ld-bar-outer"><div class="ld-bar-inner" id="ldBar"></div></div>
    <div class="ld-status" id="ldStatus">Initializing cogitator&#x2026;</div>
    <div id="ld-error"></div>
  </div>
  <div id="root"></div>

  <!-- React 18 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
  <script>
    if (!window.React) document.write('<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin><\/script>');
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script>
    if (!window.ReactDOM) document.write('<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin><\/script>');
  </script>

  <!-- Global error handler to catch script load/exec failures -->
  <script>
    var _ld = 0, _ldTotal = 22;
    var _ldMsg = [
      'Loading machine spirit...', 'Parsing unit manifests...',
      'Calibrating bolter trajectories...', 'Compiling FOC slot data...',
      'Resolving points costs...', 'Loading weapon profiles...',
      'Initializing wargear options...', 'Building army detachments...',
      'Loading army presets...',
      'Arming shooting resolver...', 'Calibrating return fire...',
      'Preparing challenge protocols...', 'Loading assault phase...',
      'Charging melee engine...', 'Rendering unit icons...',
      'Assembling UI components...', 'Compiling main cogitator...',
      'Initializing visual effects...', 'Loading unit artwork...',
      'Booting tactical map...',
      'Loading legacy manifests...',
      'Compiling battle primer...'
    ];
    function _ldUp() {
      _ld++;
      var pct = Math.round((_ld / _ldTotal) * 100);
      var b = document.getElementById('ldBar');
      var s = document.getElementById('ldStatus');
      if (b) b.style.width = pct + '%';
      if (s) s.textContent = _ldMsg[_ld - 1] || 'Finalizing...';
    }
    function _ldErr(msg) {
      var e = document.getElementById('ld-error');
      if (e) { e.style.display = 'block'; e.textContent = '⚠ ' + msg; }
      console.error('[HH-TOOLKIT]', msg);
    }
    window.onerror = function(msg, src, line) {
      _ldErr('Error in ' + (src || 'unknown') + ' line ' + line + ': ' + msg);
    };
  </script>

  <!-- App scripts — all plain JS, no transpiler needed -->
  <script src="00-boot.js"              onerror="_ldErr('Failed to load 00-boot.js')"              onload="_ldUp()"></script>
  <script src="01-constants.js"          onerror="_ldErr('Failed to load 01-constants.js')"          onload="_ldUp()"></script>
  <script src="02-unit-presets.js"       onerror="_ldErr('Failed to load 02-unit-presets.js')"       onload="_ldUp()"></script>
  <script src="03-foc-wargear.js"        onerror="_ldErr('Failed to load 03-foc-wargear.js')"        onload="_ldUp()"></script>
  <script src="04-points.js"             onerror="_ldErr('Failed to load 04-points.js')"             onload="_ldUp()"></script>
  <script src="05-weapon-profiles.js"    onerror="_ldErr('Failed to load 05-weapon-profiles.js')"    onload="_ldUp()"></script>
  <script src="06-wargear-options.js"    onerror="_ldErr('Failed to load 06-wargear-options.js')"    onload="_ldUp()"></script>
  <script src="07-army-builder-data.js"  onerror="_ldErr('Failed to load 07-army-builder-data.js')"  onload="_ldUp()"></script>
  <script src="07b-army-presets.js"      onerror="_ldErr('Failed to load 07b-army-presets.js')"      onload="_ldUp()"></script>
  <script src="08-shooting-resolver.js"  onerror="_ldErr('Failed to load 08-shooting-resolver.js')"  onload="_ldUp()"></script>
  <script src="09-return-fire.js"        onerror="_ldErr('Failed to load 09-return-fire.js')"        onload="_ldUp()"></script>
  <script src="10-challenge.js"          onerror="_ldErr('Failed to load 10-challenge.js')"          onload="_ldUp()"></script>
  <script src="11-assault.js"            onerror="_ldErr('Failed to load 11-assault.js')"            onload="_ldUp()"></script>
  <script src="12-charge.js"             onerror="_ldErr('Failed to load 12-charge.js')"             onload="_ldUp()"></script>
  <script src="13-icons.js"              onerror="_ldErr('Failed to load 13-icons.js')"              onload="_ldUp()"></script>
  <script src="14-ui-components.js"      onerror="_ldErr('Failed to load 14-ui-components.js')"      onload="_ldUp()"></script>
  <script src="15-main-app.js?v=warroom-game-2"           onerror="_ldErr('Failed to load 15-main-app.js')"           onload="_ldUp()"></script>
  <script src="16-graphics.js"           onerror="_ldErr('Failed to load 16-graphics.js')"           onload="_ldUp()"></script>
  <script src="17-artwork.js"            onerror="_ldErr('Failed to load 17-artwork.js')"            onload="_ldUp()"></script>
  <script src="19-warroom-game.js?v=warroom-game-2"       onerror="_ldErr('Failed to load 19-warroom-game.js')"       onload="_ldUp()"></script>
  <script src="20-legacy-units.js"       onerror="_ldErr('Failed to load 20-legacy-units.js')"       onload="_ldUp()"></script>
  <script src="21-tutorial.js?v=1"       onerror="_ldErr('Failed to load 21-tutorial.js')"           onload="_ldUp()"></script>

  <!-- Mount with diagnostics -->
  <script>
    (function() {
      // Verify critical globals exist
      var missing = [];
      if (typeof React === 'undefined') missing.push('React');
      if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
      if (typeof ShootingResolver === 'undefined') missing.push('ShootingResolver');
      if (typeof useState === 'undefined') missing.push('useState');
      if (typeof UNIT_PRESETS === 'undefined') missing.push('UNIT_PRESETS');
      if (typeof resolveShootingPhase === 'undefined') missing.push('resolveShootingPhase');

      if (missing.length > 0) {
        _ldErr('Missing globals: ' + missing.join(', ') + ' — check browser console for script errors');
        return;
      }

      try {
        var root = ReactDOM.createRoot(document.getElementById('root'));
        // Wrap the app in HHErrorBoundary (defined in 14-ui-components.js) so a
        // render exception in any descendant (e.g. UnitSelectorModal) shows an
        // on-screen error panel instead of silently unmounting the tree to a
        // blank white screen. Falls back to bare render if the boundary class
        // somehow didn't load.
        var rootEl = (typeof HHErrorBoundary !== 'undefined')
          ? React.createElement(HHErrorBoundary, null,
              React.createElement(ShootingResolver))
          : React.createElement(ShootingResolver);
        root.render(rootEl);
        setTimeout(function() {
          var ls = document.getElementById('loading-screen');
          if (ls) {
            ls.classList.add('fade-out');
            setTimeout(function() { ls.remove(); }, 600);
          }
        }, 200);
      } catch(e) {
        _ldErr('Mount failed: ' + e.message);
      }
    })();
  </script>
</body>
</html>
