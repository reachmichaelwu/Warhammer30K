<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horus Heresy 3rd Edition — Combat Toolkit</title>
  <meta name="description" content="Army builder, shooting resolver, assault phase, charge phase, and challenge resolver for Warhammer: The Horus Heresy Age of Darkness (3rd Edition)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    #loading-screen {
      position: fixed; inset: 0; z-index: 100000;
      background: #050f05;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      color: #00ff41;
      transition: opacity 0.5s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .ld-title {
      font-size: 22px; letter-spacing: 4px;
      text-shadow: 0 0 12px #00ff41, 0 0 30px rgba(0,255,65,0.3);
      margin-bottom: 24px;
      animation: ld-pulse 1.5s ease-in-out infinite;
    }
    .ld-bar-outer {
      width: 320px; height: 14px;
      border: 1px solid #00aa2a; background: #020802; overflow: hidden;
    }
    .ld-bar-inner {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #004d15, #00ff41);
      box-shadow: 0 0 10px #00ff41; transition: width 0.15s ease;
    }
    .ld-status {
      margin-top: 12px; font-size: 11px;
      color: #00aa2a; letter-spacing: 2px; text-transform: uppercase;
    }
    #ld-error {
      margin-top: 16px; font-size: 12px; color: #cc2222;
      text-shadow: 0 0 8px #cc2222; max-width: 500px; text-align: center;
      display: none;
    }
    @keyframes ld-pulse {
      0%,100% { text-shadow: 0 0 8px #00ff41, 0 0 20px rgba(0,255,65,0.2); }
      50%     { text-shadow: 0 0 16px #00ff41, 0 0 40px rgba(0,255,65,0.5); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="ld-title">&#x2E22; HORUS HERESY TOOLKIT &#x2E25;</div>
    <div class="ld-bar-outer"><div class="ld-bar-inner" id="ldBar"></div></div>
    <div class="ld-status" id="ldStatus">Initializing cogitator&#x2026;</div>
    <div id="ld-error"></div>
  </div>
  <div id="root"></div>

  <!-- React 18 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
  <script>
    if (!window.React) document.write('<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin><\/script>');
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script>
    if (!window.ReactDOM) document.write('<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin><\/script>');
  </script>

  <!-- Global error handler to catch script load/exec failures -->
  <script>
    var _ld = 0, _ldTotal = 16;
    var _ldMsg = [
      'Loading machine spirit...', 'Parsing unit manifests...',
      'Calibrating bolter trajectories...', 'Compiling FOC slot data...',
      'Resolving points costs...', 'Loading weapon profiles...',
      'Initializing wargear options...', 'Building army detachments...',
      'Arming shooting resolver...', 'Calibrating return fire...',
      'Preparing challenge protocols...', 'Loading assault phase...',
      'Charging melee engine...', 'Rendering unit icons...',
      'Assembling UI components...', 'Compiling main cogitator...'
    ];
    function _ldUp() {
      _ld++;
      var pct = Math.round((_ld / _ldTotal) * 100);
      var b = document.getElementById('ldBar');
      var s = document.getElementById('ldStatus');
      if (b) b.style.width = pct + '%';
      if (s) s.textContent = _ldMsg[_ld - 1] || 'Finalizing...';
    }
    function _ldErr(msg) {
      var e = document.getElementById('ld-error');
      if (e) { e.style.display = 'block'; e.textContent = '⚠ ' + msg; }
      console.error('[HH-TOOLKIT]', msg);
    }
    window.onerror = function(msg, src, line) {
      _ldErr('Error in ' + (src || 'unknown') + ' line ' + line + ': ' + msg);
    };
  </script>

  <!-- App scripts — all plain JS, no transpiler needed -->
  <script src="00-boot.js"              onerror="_ldErr('Failed to load 00-boot.js')"              onload="_ldUp()"></script>
  <script src="01-constants.js"          onerror="_ldErr('Failed to load 01-constants.js')"          onload="_ldUp()"></script>
  <script src="02-unit-presets.js"       onerror="_ldErr('Failed to load 02-unit-presets.js')"       onload="_ldUp()"></script>
  <script src="03-foc-wargear.js"        onerror="_ldErr('Failed to load 03-foc-wargear.js')"        onload="_ldUp()"></script>
  <script src="04-points.js"             onerror="_ldErr('Failed to load 04-points.js')"             onload="_ldUp()"></script>
  <script src="05-weapon-profiles.js"    onerror="_ldErr('Failed to load 05-weapon-profiles.js')"    onload="_ldUp()"></script>
  <script src="06-wargear-options.js"    onerror="_ldErr('Failed to load 06-wargear-options.js')"    onload="_ldUp()"></script>
  <script src="07-army-builder-data.js"  onerror="_ldErr('Failed to load 07-army-builder-data.js')"  onload="_ldUp()"></script>
  <script src="08-shooting-resolver.js"  onerror="_ldErr('Failed to load 08-shooting-resolver.js')"  onload="_ldUp()"></script>
  <script src="09-return-fire.js"        onerror="_ldErr('Failed to load 09-return-fire.js')"        onload="_ldUp()"></script>
  <script src="10-challenge.js"          onerror="_ldErr('Failed to load 10-challenge.js')"          onload="_ldUp()"></script>
  <script src="11-assault.js"            onerror="_ldErr('Failed to load 11-assault.js')"            onload="_ldUp()"></script>
  <script src="12-charge.js"             onerror="_ldErr('Failed to load 12-charge.js')"             onload="_ldUp()"></script>
  <script src="13-icons.js"              onerror="_ldErr('Failed to load 13-icons.js')"              onload="_ldUp()"></script>
  <script src="14-ui-components.js"      onerror="_ldErr('Failed to load 14-ui-components.js')"      onload="_ldUp()"></script>
  <script src="15-main-app.js"           onerror="_ldErr('Failed to load 15-main-app.js')"           onload="_ldUp()"></script>

  <!-- Mount with diagnostics -->
  <script>
    (function() {
      // Verify critical globals exist
      var missing = [];
      if (typeof React === 'undefined') missing.push('React');
      if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
      if (typeof ShootingResolver === 'undefined') missing.push('ShootingResolver');
      if (typeof useState === 'undefined') missing.push('useState');
      if (typeof UNIT_PRESETS === 'undefined') missing.push('UNIT_PRESETS');
      if (typeof resolveShootingPhase === 'undefined') missing.push('resolveShootingPhase');

      if (missing.length > 0) {
        _ldErr('Missing globals: ' + missing.join(', ') + ' — check browser console for script errors');
        return;
      }

      try {
        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(ShootingResolver));
        setTimeout(function() {
          var ls = document.getElementById('loading-screen');
          if (ls) {
            ls.classList.add('fade-out');
            setTimeout(function() { ls.remove(); }, 600);
          }
        }, 200);
      } catch(e) {
        _ldErr('Mount failed: ' + e.message);
      }
    })();
  </script>
</body>
</html>
