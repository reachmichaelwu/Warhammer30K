<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horus Heresy 30K — Combat Resolver</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- React & ReactDOM (UMD — sets window.React, window.ReactDOM) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (transpiles JSX at runtime) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #1a1610; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; color: #c8b898;
      font-family: 'Share Tech Mono', monospace; font-size: 18px;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div id="root"><div id="loading">INITIALISING COMBAT COGITATOR…</div></div>

  <!-- Data modules (plain JS, no JSX — load in dependency order) -->
  <script src="js/constants.js"></script>
  <script src="js/unitData.js"></script>
  <script src="js/weaponData.js"></script>
  <script src="js/resolvers.js"></script>

  <!-- JSX app — Babel transpiles this in the browser -->
  <script type="text/babel" src="js/app.jsx" data-presets="react"></script>
</body>
</html>
